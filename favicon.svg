<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34f5c5"/>
      <stop offset="50%" stop-color="#00d9f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="60" fill="#070c18" stroke="#00d9f9" stroke-width="2.5" stroke-opacity="0.45"/>
  <!-- Master A Monogram -->
  <g filter="url(#glow-blur)">
    <!-- Outer A Chevron Legs -->
    <path d="M64 26 L30 100 L44 100 L64 54 L84 100 L98 100 Z" fill="url(#cyan-glow)"/>
    <!-- Voice Waveform Bars inside A triangle -->
    <rect x="52" y="70" width="4.5" height="16" rx="2.2" fill="#00d9f9"/>
    <rect x="58" y="64" width="4.5" height="26" rx="2.2" fill="#34f5c5"/>
    <rect x="64" y="60" width="4.5" height="32" rx="2.2" fill="#ffffff"/>
    <rect x="70" y="64" width="4.5" height="26" rx="2.2" fill="#34f5c5"/>
    <rect x="76" y="70" width="4.5" height="16" rx="2.2" fill="#00d9f9"/>
  </g>
</svg>
